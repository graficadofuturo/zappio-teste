<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-dark: #09090b;
      --bg-card: #18181b;
      --border-color: #27272a;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --green: #10b981;
      --green-hover: #059669;
      --green-glow: rgba(16, 185, 129, 0.15);
      --red: #f87171;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-primary);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .logo-img {
      width: 28px;
      height: 28px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-secondary);
      margin: 2px 0 0 0;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 12px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      transition: all 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--green);
      box-shadow: 0 0 8px var(--green-glow);
    }

    .divider {
      height: 1px;
      background-color: var(--border-color);
      margin: 16px 0;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--green);
      color: #022c1a;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: var(--green-hover);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
    }

    .btn:disabled {
      background-color: #27272a;
      color: #71717a;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
      display: none;
      word-break: break-word;
    }

    .status-success {
      background-color: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    .status-error {
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #022c1a;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <title>Zappio Sync</title>
</head>
<body>
  <div class="header">
    <img src="icon.png" class="logo-img" alt="Zappio">
    <div>
      <h1 class="title">Zappio Sync</h1>
      <p class="subtitle">Sincronizador Mercado Livre & AliExpress</p>
    </div>
  </div>

  <div class="form-group">
    <label for="zappio-url">Servidor do Zappio</label>
    <select id="zappio-url">
      <option value="https://zappio-teste.vercel.app">Produção (Vercel)</option>
      <option value="http://localhost:3000">Desenvolvimento Local</option>
    </select>
  </div>

  <div class="divider"></div>

  <div class="form-group">
    <label for="affiliate-tag">Mercado Livre - Tag de Afiliado</label>
    <input type="text" id="affiliate-tag" placeholder="Ex: MLB1234567" value="MLB">
  </div>

  <div class="form-group">
    <label for="aliexpress-tag">AliExpress - Tag de Afiliado</label>
    <input type="text" id="aliexpress-tag" placeholder="Tag de afiliado do AliExpress" value="">
  </div>

  <button id="sync-btn" class="btn">
    Sincronizar Contas
  </button>

  <div id="status" class="status-box"></div>

  <script src="popup.js"></script>
</body>
</html>
